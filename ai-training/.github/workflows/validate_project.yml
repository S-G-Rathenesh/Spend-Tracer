name: SpendGuard AI Continuous Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyyaml

      - name: Validate Python Syntax
        run: |
          python -m py_compile validation/validate_project.py
          python -m py_compile training/experiment_tracker.py

      - name: Validate JSON Formatting
        run: |
          python -c "import glob, json; [json.load(open(f, encoding='utf-8')) for f in glob.glob('**/*.json', recursive=True)]"

      - name: Run Project Integrity & Validation Suite
        run: |
          python validation/validate_project.py
